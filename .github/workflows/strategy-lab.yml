          PAYLOAD
            base64 -d "$RUNNER_TEMP/strategy-lab-archive.b64" | tar -xz -C .
            echo 'Independent Strategy Lab source installed.'
          else
            echo 'Existing project preserved.'
          fi
      - name: Install free price data and ML dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Test point-in-time engine
        run: python -m unittest discover -s tests -v
      - name: Backtest strategy and evaluate training readiness
        env:
          STRATEGY_PATH: ${{ inputs.strategy || 'strategies/trend_breakout.json' }}
        run: python runner.py --strategy "$STRATEGY_PATH"
      - name: Commit project source, then market cache and research reports
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore engine.py runner.py train.py index.html sw.js manifest.webmanifest icon-192.png icon-512.png README.md requirements.txt
          git add strategies data tests results
          if ! git diff --cached --quiet; then
            git commit -m 'Strategy Lab: create or update independent backtest template'
            git push
          fi
