# Install in a NEW, SEPARATE GitHub repository only, never in Supply Scout.
# Self-contained one-file iPhone bootstrap; no third-party hosting or paid credits.
name: Strategy Lab - Bootstrap & Backtest
on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Strategy JSON path'
        type: string
        default: 'strategies/trend_breakout.json'
        required: false
  schedule:
    - cron: '14 23 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'engine.py'
      - 'runner.py'
      - 'train.py'
      - 'strategies/**'
      - 'data/verified_events.csv'
      - 'tests/**'
permissions:
  contents: write
concurrency:
  group: strategy-lab-template
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: First-time install of independent Strategy Lab source
        shell: bash
        run: |
          if [ ! -f engine.py ]; then
